[package]
name = "clust-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
diagnostic = []

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

[dependencies]
clust_tokio = { package = "tokio", version = "=1.54.1", features = ["rt-multi-thread", "sync"] }
