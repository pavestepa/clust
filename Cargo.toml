[workspace]
resolver = "2"
members = ["compiler/frontend", "compiler/semantics", "compiler/core", "cli", "runtime", "lsp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
