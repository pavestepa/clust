[package]
name = "clust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
clust-runtime = { path = "../runtime" }
clust-frontend = { path = "../compiler/frontend" }
clust-core = { path = "../compiler/core" }
clust-semantics = { path = "../compiler/semantics" }
toml = { version = "=1.2.1", default-features = false, features = ["parse", "display", "std", "serde"] }

[lints]
workspace = true

[dependencies.syn]
version = "2"
features = ["full", "visit", "visit-mut"]

[dependencies.quote]
version = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
